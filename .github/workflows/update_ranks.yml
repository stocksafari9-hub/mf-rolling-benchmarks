name: Daily Benchmark Update

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

# THIS IS THE FIX: Explicitly grants the script permission to save the JSON file
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Updated to v4 to eliminate the Node.js deprecation warning
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Updated to v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run Rolling Return Engine
        run: python main.py

      - name: Commit and Push ranks.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ranks.json
          git commit -m "Auto-update median rolling returns" || echo "No changes to commit"
          git push
