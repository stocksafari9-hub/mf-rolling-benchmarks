name: Daily Benchmark Update

on:
  schedule:
    # Runs at 21:00 UTC every day (which is 2:30 AM IST)
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows you to run it manually by clicking a button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run Rolling Return Engine
        run: python main.py

      - name: Commit and Push ranks.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ranks.json
          git commit -m "Auto-update median rolling returns" || echo "No changes to commit"
          git push
